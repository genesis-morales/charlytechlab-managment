name: Validate v1

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      PG_BIN: /usr/lib/postgresql/16/bin
      DATABASE_URL: postgresql://localhost/ctlab_generation
      DIRECT_URL: postgresql://localhost/ctlab_generation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verificar PostgreSQL local
        run: |
          test -x "$PG_BIN/initdb"
          test -x "$PG_BIN/pg_ctl"
          "$PG_BIN/postgres" --version
      - name: Instalar dependencias
        run: npm ci
      - name: Generar cliente Prisma
        run: npm run db:generate
      - name: Verificar seguridad, pruebas y compilaciones
        run: npm run check
      - name: Probar integración en PostgreSQL aislado
        run: npm run test:integration
      - name: Auditar dependencias
        run: npm audit --audit-level=high
